[project]
name = "weatheragent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.67",
    "cfgrib>=0.9.15.1",
    "climate-learn==1.0.0",
    "country-converter>=1.3.2",
    "cryptography>=50.0.0",
    "dask[array,dataframe]>=2026.7.1",
    "dinosaur==1.3.5",
    "eccodeslib>=2.48.0.26",
    "fastapi>=0.141.1",
    "flax>=0.12.8",
    "func-timeout>=4.3.5",
    "geopandas>=1.1.4",
    "h5netcdf>=1.8.1",
    "h5py>=3.16.0",
    "haversine>=2.9.0",
    "httpcore>=1.0.9",
    "httpx>=0.28.1",
    "hydra-core>=1.3.5",
    "jax-datetime>=0.1.2",
    "jax[cuda12]>=0.11.0",
    "joblib>=1.5.3",
    "langchain-core>=1.5.3",
    "langgraph>=1.2.10",
    "lightning>=2.5,<3",
    "matplotlib>=3.11.1",
    "metpy>=1.7,<2",
    "netcdf4>=1.7.4",
    "numcodecs<0.16",
    "numpy>=2.5.2",
    "omegaconf>=2.3.1",
    "openai>=2.53.0",
    "pandas>=3.0.5",
    "pot>=0.9.7.post1",
    "pyarrow>=25.0.0",
    "rapidfuzz>=3.14.5",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "shapely>=2.1.2",
    "tiktoken>=0.13.0",
    "timm==0.9.2",
    "torch==2.12.0",
    "torchvision==0.27.0",
    "tqdm>=4.70.0",
    "tree-math>=0.2.1",
    "uvicorn[standard]>=0.52.1",
    "xarray>=2026.7.0",
    "zarr<3",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
